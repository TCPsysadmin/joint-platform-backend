services:
  - type: web
    name: media-transcription-service
    env: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    disk:
      name: transcription-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TEMP_STORAGE_DIR
        value: /data

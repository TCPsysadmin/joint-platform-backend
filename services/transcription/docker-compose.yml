version: '3.8'

services:
  transcription-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TEMP_STORAGE_DIR=/data
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - transcription-data:/data

volumes:
  transcription-data:

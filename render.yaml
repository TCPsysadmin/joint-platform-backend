services:
  - type: web
    name: video-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_API_BASE
        value: "https://api.x.ai/v1"
      - key: OPENAI_API_KEY
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: TRANSCRIPTION_API_URL
        sync: false
      - key: TRANSCRIPTION_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: MAX_CRITIQUE_ITERATIONS
        value: "3"
      - key: EMBEDDING_MODEL
        value: "text-embedding-3-small"
      - key: LLM_MODEL
        value: "grok-4"
      - key: USE_MCP_TOOLS
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
